# fortis — a Bitcoin + BLAKE2b-fork wallet library.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/fortistechlabs/fortis"

[workspace.dependencies]
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# wallet stack
bitcoin = { version = "0.32", features = ["base64"] }
bip39 = "2"
miniscript = "12"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

# bindings
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
uniffi = "0.29"

[profile.release]
lto = "thin"

# A debug build of RocksDB itself (librocksdb-sys) is unusably slow at
# runtime otherwise -- doesn't affect [profile.release], which already
# builds everything optimized.
[profile.dev.package.librocksdb-sys]
opt-level = 3
