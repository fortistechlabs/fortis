# fortis — a Bitcoin + BLAKE2b-fork wallet library.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/fortistechlabs/fortis"

[workspace.dependencies]
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# wallet stack
bitcoin = { version = "0.32", features = ["base64", "serde"] }
bip39 = "2"
miniscript = "12"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

# bindings
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
uniffi = "0.29"

# lightning (fortis-lightning only; never a dependency of wallet-core/wallet-wasm)
ldk-node = "=0.7.1"
# ldk-node 0.7.1 itself depends on vss-client-ng 0.4; pinned to the same release
# so our own VSS calls (device lock) speak the exact same client/protocol.
vss-client = { package = "vss-client-ng", version = "=0.4.1" }

# tiny_http 0.12.0 allocates a request's whole declared, unread Content-Length
# when it drops the body reader, so one request declaring a huge length aborts
# the process. vendor/tiny_http is 0.12.0 with that one drain loop bounded
# (see the FORTIS PATCH comment in src/util/equal_reader.rs). Drop this patch
# once upstream fixes it.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }

[profile.release]
lto = "thin"

# A debug build of RocksDB itself (librocksdb-sys) is unusably slow at
# runtime otherwise -- doesn't affect [profile.release], which already
# builds everything optimized.
[profile.dev.package.librocksdb-sys]
opt-level = 3
