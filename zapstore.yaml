name: Fortis Wallet
summary: Bitcoin XBT, Bitcoin BTC and Lightning wallet, keys on your phone
description: |
  A mobile wallet for Bitcoin XBT, Bitcoin BTC and Lightning, locked with your fingerprint. Your recovery phrases are generated on your phone, encrypted there, and never leave it.

  Lightning (new in 0.6):
  - A Lightning wallet of its own, with its own recovery phrase. Your phone runs its own Lightning node; only it can spend what's in your channel.
  - Pay invoices, Lightning addresses, LNURL and BOLT12 offers. The most you could pay in routing fees is shown before you confirm.
  - Get paid while the app is closed: the Fortis Lightning provider holds the payment and notifies you; open Fortis and it arrives.
  - A reusable BOLT12 address you share once and get paid to again and again.
  - Move sats between on-chain and Lightning in a couple of taps, and choose which BTC wallet receives them.
  - A history that works like a ledger: every payment, move and fee (network, transfer, routing) with the balance after each, so every sat reconciles.
  - Your first channel opens with a payment of 11,000 sat or more (fee 0.5%, minimum 1,000 sat, shown before you share the invoice).
  - Honest about custody: smaller payments, and payments you don't collect within a few hours, are held by Fortis on your Fortis balance until they add up to more than 50,000 sat and move into a channel of your own. The app shows that balance separately. Details: https://fortistechlabs.com/lightning
  - Encrypted channel backup, restored from the wallet's phrase. A cooperative close sends everything on-chain; a force close is offered if the provider can't be reached.

  Everything else:

  - Locked with your fingerprint (or face, or device PIN): the key that opens the app is held in your phone's secure hardware (StrongBox or the TEE) and is released only when you unlock - one unlock opens every wallet.
  - Locks itself a minute after you leave it, and clears your keys from memory; swaps carry on in the background.
  - Asks again before it shows your recovery phrase or sends coins.
  - Your recovery phrase is encrypted on the phone (Argon2id + XChaCha20-Poly1305) and never sent anywhere.
  - Every screen is kept out of screenshots, screen recordings and the recent-apps view.
  - Swap BTC <-> XBT with another person: atomic and non-custodial (on-chain HTLCs, nobody holds your coins in the middle). Post an offer, take one from the list, or swap privately by code; it runs in the background, a cancelled match releases your coins back within minutes, and "Find my swaps" recovers them from your phrase on a new phone.
  - 12- or 24-word BIP-39 phrase, BIP-84 native SegWit, optional passphrase.
  - Up to 10 named wallets, any mix of XBT and BTC, from the one phrase.
  - Send and receive with QR codes, a built-in camera scanner, or paste.
  - Fee presets or a custom sat/vB rate; "take the fees out of this amount"; sweep a whole balance.
  - History with a tap-through to a block explorer; approximate value in USD, EUR or 28 other currencies (Settings -> Currency).
  - Use your own server: point BTC, XBT or both at your own Esplora / mempool server (Settings -> Your server), so your addresses, balances and history never reach fortis. It's checked before it's used, there's no silent fallback to anyone else's, and sends through it pay no service fee. Swaps still go through fortis.
  - Connect a hardware wallet (Keystone, Passport, SeedSigner, Jade and others) as a view-only BTC wallet by scanning its account QR.
  - Cross-chain replay protection: SIGHASH_UNIFIED on every XBT send (automatic), plus an optional oversized OP_RETURN on BTC sends.
  - Extra entropy from your hands: shake the phone, scribble on screen, or CPU-timing jitter, folded into the seed.
  - In 75 languages, picked in Settings or following your phone.
  - Help & support in Settings, and a "Send to support" button on every error.
  - No analytics, no ads. The one third-party SDK is Firebase Cloud Messaging, used only for Lightning payment notifications, and only once you add a Lightning wallet. No account, no sign-up; for on-chain wallets the backend only sees public addresses and finished signed transactions. Privacy policy: https://fortistechlabs.com/privacy

  Standard, portable on-chain keys - restore the same phrase in any BIP-84 wallet. Open source (MIT). Works without Google Play Services; only Lightning notifications need it.

