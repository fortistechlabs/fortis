# Zapstore publication - https://zapstore.dev/docs/publish
#
# zsp has no Windows build; publish from WSL:
#   wsl -d Ubuntu-24.04
#   SIGN_WITH=nsec1...  ~/bin/zsp publish /mnt/c/Repos/fortis/zapstore.yaml
#
# One-time first: link the APK signing cert to the Nostr identity -
#   SIGN_WITH=nsec1...  ~/bin/zsp identity --link-key /mnt/c/Repos/fortis/android/fortis-upload.jks --key-alias fortis

