# Zapstore publication - https://zapstore.dev/docs/publish
#
# Publish (zsp in ~/.local/bin; nsec read without echo, never in shell history):
#   read -rsp 'nsec: ' SIGN_WITH; echo; export SIGN_WITH
#   zsp publish ~/Work/fortis/zapstore.yaml
#   unset SIGN_WITH
#
# One-time first (done): link the APK signing cert to the Nostr identity -
#   zsp identity --link-key ~/Work/fortis/android/fortis-upload.jks --key-alias fortis

repository: https://github.com/fortistechlabs/fortis

