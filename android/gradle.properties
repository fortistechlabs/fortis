org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 defaults built-in Kotlin on; we apply the Kotlin plugin ourselves so the
# Compose / atomicfu compiler plugins and Gobley behave predictably.
android.builtInKotlin=false
# AGP 9 buildConfig/resValues default off — we use neither. Escape hatch if a
# plugin blocks the new DSL (removed in AGP 10):  android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.newDsl=false
android.sourceset.disallowProvider=false
