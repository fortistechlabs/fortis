# /etc/systemd/system/cloudflared.service.d/10-fortis-hardening.conf
# The tunnel is the one process facing the internet: run it as its own user,
# not root, reading only /etc/cloudflared (root:cloudflared, 0750/0640), in the
# same sandbox as the fortis units. Installed by deploy/linux-home/install.sh.
[Service]
User=cloudflared
Group=cloudflared
UMask=0077
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
DevicePolicy=closed
CapabilityBoundingSet=
AmbientCapabilities=
ProtectClock=true
ProtectControlGroups=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectProc=invisible
# Netlink: it reads the host's addresses to pick IPv4/IPv6 for the tunnel.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
MemoryDenyWriteExecute=true
RemoveIPC=true
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
# Peaks near 75 MB.
MemoryMax=512M
