# The fortis backend stack: fortis-index (XBT) + fortis-edge, optionally Caddy.
#
# The Bitcoin Knots / Bitcoin Core nodes stay on the host — the containers reach
# them at host.docker.internal. Copy .env.example to .env and fill it in.
#
#   docker compose -f deploy/docker-compose.yml up -d            # index + edge
#   docker compose -f deploy/docker-compose.yml --profile tls up -d   # + Caddy

x-image: &image
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: fortis-backend:latest
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway" # Linux; Docker Desktop provides it anyway

services:
  index:
    <<: *image
    entrypoint: /usr/local/bin/fortis-index
    # add `--start-height N` here to index from somewhere other than the fork height
    command: >
      --network ${NETWORK:-mainnet}
      --rpc-url ${XBT_RPC_URL:-http://host.docker.internal:8332}
      --rpc-auth ${XBT_RPC_AUTH}
      --db /data/fortis-index.sqlite
      --bind 0.0.0.0:8094
    volumes:
      - index-data:/data
    # not published — only the edge talks to it
    expose:
      - "8094"

  edge:
    <<: *image
    command: >
      --bind 0.0.0.0:8098
      --xbt-upstream http://index:8094
      --btc-upstream ${BTC_UPSTREAM:-https://mempool.space/api}
      --btc-price-url ${BTC_PRICE_URL:-https://api.kraken.com/0/public/Ticker?pair=XBTUSD}
      --xbt-price-url ${XBT_PRICE_URL:-https://mempool.kilombino.com/api/v1/prices}
      --btc-upstream-rate ${BTC_UPSTREAM_RATE:-5}
      --btc-haskoin-url ${BTC_HASKOIN_URL:-https://api.haskoin.com/btc}
      --secret-file /data/fortis-edge.secret
      --require-token
      --trust-forwarded-for
      --allow-origin ${ALLOW_ORIGIN:-*}
      --rate-per-min ${RATE_PER_MIN:-120}
      --rate-burst ${RATE_BURST:-60}
    depends_on:
      - index
    volumes:
      - edge-data:/data
    ports:
      - "127.0.0.1:8098:8098" # localhost only — Caddy / Tailscale fronts it

  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["tls"]
    network_mode: host # so reverse_proxy 127.0.0.1:8098 reaches the edge
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  index-data:
  edge-data:
  caddy-data:
  caddy-config:
