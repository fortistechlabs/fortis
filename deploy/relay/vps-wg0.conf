# /etc/wireguard/wg0.conf on the VPS
[Interface]
Address = 10.8.0.1/24
ListenPort = 51820
PrivateKey = <contents of /etc/wireguard/vps.key>
PostUp = sysctl -w net.ipv4.ip_forward=1; nft -f /etc/wireguard/lnrelay.nft
PostDown = nft delete table ip lnrelay

[Peer]
# home machine
PublicKey = <contents of home.pub>
AllowedIPs = 10.8.0.2/32
