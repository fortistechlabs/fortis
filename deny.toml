# cargo-deny policy (Task 19, step 4). Run: `cargo deny check`.
# Reviewed with cargo-deny 0.20.2 / cargo-audit 0.22.2 on 2026-10-31.

[graph]
# What ships: the host servers and the Android native library.
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android"]

[advisories]
version = 2
ignore = [
    # basic-toml is unmaintained. It is only reached through
    # uniffi_bindgen -> askama_derive (a build-time proc macro that generates
    # the Kotlin bindings); it is not linked into any shipped binary. Revisit
    # when uniffi moves off askama 0.13.
    { id = "RUSTSEC-2026-0374", reason = "build-time only (uniffi_bindgen -> askama_derive); not in any shipped binary" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "CDLA-Permissive-2.0",
    "MITNFA",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# The workspace crates depend on each other by path without a version (they are
# not published), which cargo-deny reports as wildcards.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
