[package]
name = "fortis-index"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "fortis address indexer: an Esplora-shaped REST API over a Bitcoin Knots / BLAKE2b node, so many wallets can share one backend without per-user node state."

[[bin]]
name = "fortis-index"
path = "src/main.rs"

[dependencies]
fortis-node = { path = "../fortis-node" }
bitcoin = { workspace = true }
anyhow = "1"
hex = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
arc-swap = "1.9"
rocksdb = "0.25"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = { version = "0.5", features = ["limit", "util"] }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["json"] }
