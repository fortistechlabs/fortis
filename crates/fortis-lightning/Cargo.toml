[package]
name = "fortis-lightning"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "fortis Lightning: the only code that touches LDK. Wraps ldk-node (LDK v0.2 line) with VSS backup; exposed to Android through wallet-ffi. Not pure (does I/O), so it lives beside wallet-core."

[dependencies]
wallet-core = { path = "../wallet-core" }
zeroize = { workspace = true }
hex = { workspace = true }
ldk-node = { workspace = true }
vss-client = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
url = "=2.5.8"
ureq = { version = "2", default-features = false, features = ["tls"] }
# Same crate/version ldk-node re-exports; direct for the recovery sweeper
# (base64 for RPC basic auth).
bitcoin = { workspace = true }


[dev-dependencies]
# Real consensus script verification of sweep transactions (tests only).
bitcoin = { workspace = true, features = ["bitcoinconsensus"] }
