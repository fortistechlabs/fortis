[package]
name = "wallet-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "fortis command-line wallet: drives wallet-core against a Bitcoin Knots / BLAKE2b-fork full node over JSON-RPC. Read-only for now (watch-only import, addresses, balance, UTXOs)."

[[bin]]
name = "fortis"
path = "src/main.rs"

[dependencies]
wallet-core = { path = "../wallet-core" }
fortis-node = { path = "../fortis-node" }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
getrandom = "0.2"
rpassword = "7"
