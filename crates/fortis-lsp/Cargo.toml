[package]
name = "fortis-lsp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "fortis Lightning service provider: ldk-node in LSPS2-service mode (JIT channels), bitcoind RPC chain source, Prometheus metrics on localhost."

[[bin]]
name = "fortis-lsp"
path = "src/main.rs"

[dependencies]
ldk-node = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.5"
tiny_http = "0.12"
libc = "0.2"
# Fortis account ledger (same version ldk-node already bundles).
rusqlite = { version = "0.31", features = ["bundled"] }
hex = { workspace = true }
thiserror = { workspace = true }
# Push notifications (push.rs): HTTPS to Google, RS256 JWTs. Both already in the lockfile.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
ring = "0.17"
base64 = "0.22"
